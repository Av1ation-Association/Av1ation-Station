[package]
name = "av1ation-service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
av1ation-contracts = { path = "../contracts" }
av1ation-engine = { path = "../engine" }
axum.workspace = true
futures-util.workspace = true
regex.workspace = true
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "native-tls",
] }
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# The script editor's language server ships as a zip; only decompression is needed.
zip = { version = "4", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

[dev-dependencies]
av1ation-test-support.workspace = true
http-body-util = "0.1"
proptest = "1.12.0"
tower = { version = "0.5", features = ["util"] }
