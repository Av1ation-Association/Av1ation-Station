# Reviewed release policy for the Rust dependency graph. This is a release-time gate,
# not a pull-request check; vulnerability advisories remain `cargo audit`'s signal.
#
# Keep this policy intentional: a new licence or source needs an explicit review here,
# not a blanket allow.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[licenses]
# The application is GPL-3.0-only. These are the licences represented in the locked
# graph; the list is intentionally limited to licences compatible with that release.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-2-Clause-Patent",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "ISC",
    "LicenseRef-AOM-Patent-1.0",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

# The pinned engine predates SPDX's `-only` suffix; keep the deprecated identifier scoped
# to that one package rather than allowing it across the graph.
[[licenses.exceptions]]
crate = "andean-condor"
allow = ["GPL-3.0"]

# av1-grain ships a BSD-2-Clause LICENSE plus the AOM patent license without a Cargo
# `license` field. The upstream file is the ground truth; the hash makes the clarification
# expire if it changes.
[[licenses.clarify]]
crate = "av1-grain"
expression = "BSD-2-Clause AND LicenseRef-AOM-Patent-1.0"
license-files = [{ path = "LICENSE", hash = 0xa48af28d }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/rust-av/Av1an"]

[bans]
# Duplicate versions are reported for review, but are not a release failure: the graph
# contains intentional schema and platform duplicates. Path and `.workspace = true`
# dependencies are internal pins, not registry wildcards; cargo-deny 0.20 can misreport
# them, so wildcard findings are reviewed warnings rather than a false release failure.
multiple-versions = "warn"
wildcards = "warn"
allow-workspace = true
