name: Screenshots

# The deterministic gallery is an advisory visual record, never a merge gate. It is manual
# only: its output is website and release asset material, and the website that consumes it is
# not designed yet, so generating it on every renderer change would produce images nobody
# reads. Run it on dispatch when those assets are needed.
on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: screenshots-${{ github.ref }}
    cancel-in-progress: true

jobs:
    gallery:
        name: Screenshot gallery
        runs-on: windows-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npx playwright install chromium
            # The gallery generates a tiny WebM and converts the finished PNGs to AVIF with
            # the same FFmpeg. No encoder, VapourSynth install, or service is involved.
            - run: choco install ffmpeg -y --no-progress
            - run: npm run screenshots
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: screenshots
                  path: dist/screenshots/
                  if-no-files-found: warn
