name: Release security

# Release-time gates. This workflow is reusable by the release workflow and can also be
# dispatched to verify the policies without publishing anything.
on:
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    cargo-deny:
        name: Cargo licence, ban, and source policy
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: "1.97"
            - name: Install cargo-deny 0.20.2
              shell: bash
              env:
                  CARGO_DENY_VERSION: "0.20.2"
                  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
              run: |
                  set -euo pipefail
                  archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
                  curl -fsSLo "$archive" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}"
                  echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum -c -
                  tar -xzf "$archive"
                  install -m 0755 "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" "$RUNNER_TEMP/cargo-deny"
                  echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
            - name: Run the reviewed Cargo policy
              run: cargo-deny --manifest-path rust/Cargo.toml check licenses bans sources

    secret-scan:
        name: Repository secret scan
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - name: Install gitleaks 8.30.1
              shell: bash
              env:
                  GITLEAKS_VERSION: "8.30.1"
                  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
              run: |
                  set -euo pipefail
                  archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
                  echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
                  tar -xzf "$archive" gitleaks
                  install -m 0755 gitleaks "$RUNNER_TEMP/gitleaks"
                  echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
            - name: Scan the repository snapshot
              run: gitleaks dir . --config .gitleaks.toml --redact --verbose --exit-code 1
